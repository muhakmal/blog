# CMS config (Sveltia CMS, Decap-compatible). Served at /blog/admin/config.yml.
backend:
  name: github
  repo: muhakmal/blog
  branch: main # Commits here trigger the "Deploy to GitHub Pages" workflow.

site_url: https://muhakmal.github.io/blog
display_url: https://muhakmal.github.io/blog
logo_url: /blog/icon.png

media_folder: public/media # Uploaded files are committed here...
public_folder: /blog/media # ...and referenced in posts with this prefix.

collections:
  - name: posts
    label: Blog Posts
    label_singular: Post
    description: Tulisan blog. Post dengan Draft aktif tidak ikut dipublikasikan.
    folder: extracted_content
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    preview_path: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - label: Excerpt
        name: excerpt
        widget: text
        required: false
        hint: Ringkasan singkat untuk kartu di daftar tulisan. Kosongkan untuk memakai paragraf pertama.
      - label: Cover Image
        name: cover
        widget: image
        required: false
        hint: Gambar sampul (idealnya 1200×630) untuk kartu tulisan, header artikel, dan pratinjau saat dibagikan.
      - label: Last Updated
        name: updated
        widget: datetime
        required: false
        hint: Isi kalau tulisan direvisi besar. Kosongkan untuk memakai tanggal commit terakhir.
      - { label: Categories, name: categories, widget: list, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }
